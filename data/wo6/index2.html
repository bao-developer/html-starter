<!doctype html>
<html lang="vi">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Tập Sắp Xếp Thứ Tự Scratch</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-wrapper {
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow-y: auto;
      padding: 20px;
    }

    .exercise-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .exercise-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .exercise-number {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .draggable-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .draggable-item {
      background: #f3f4f6;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 16px;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
      transition: all 0.3s ease;
    }

    .draggable-item:hover {
      background: #ede9fe;
      border-color: #667eea;
      transform: translateX(4px);
    }

    .draggable-item.dragging {
      opacity: 0.5;
      background: #dbeafe;
      border-color: #667eea;
    }

    .draggable-item.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .item-number {
      background: #667eea;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .item-number.correct {
      background: #22c55e;
    }

    .item-text {
      color: #374151;
      font-size: 15px;
      flex: 1;
      line-height: 1.4;
    }

    .drag-handle {
      color: #9ca3af;
      flex-shrink: 0;
    }

    .buttons-container {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-reset {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-reset:hover {
      background: #d1d5db;
    }

    .feedback-message {
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    .feedback-success {
      background: #dcfce7;
      color: #166534;
      border: 2px solid #22c55e;
    }

    .feedback-error {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
    }

    .feedback-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .progress-info {
      font-size: 13px;
      color: #6b7280;
      margin-top: 12px;
      text-align: center;
    }

    .container-header {
      max-width: 1000px;
      margin: 0 auto 24px;
      text-align: center;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.9);
    }

    .exercises-container {
      max-width: 1000px;
      margin: 0 auto;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="app-wrapper">
   <div class="container-header">
    <div class="app-title" id="appTitle">
     Bài Tập Sắp Xếp Thứ Tự
    </div>
    <div class="app-subtitle">
     Kéo thả các mục để sắp xếp theo đúng thứ tự
    </div>
   </div>
   <div class="exercises-container"><!-- Bài tập 1 -->
    <div class="exercise-card">
     <div class="exercise-title">
      <div class="exercise-number">
       1
      </div><span>Các bước tạo chương trình Scratch kể các việc hằng ngày</span>
     </div>
     <div class="draggable-area" id="exercise1"><!-- Items will be generated by JavaScript -->
     </div>
     <div class="feedback-message" id="feedback1"></div>
     <div class="progress-info" id="progress1"></div>
     <div class="buttons-container"><button class="btn btn-reset" onclick="resetExercise(1)"> <i data-lucide="rotate-ccw" style="width: 16px; height: 16px; display: inline; margin-right: 6px;"></i> Làm lại </button> <button class="btn btn-primary" onclick="checkExercise(1)"> <i data-lucide="check" style="width: 16px; height: 16px; display: inline; margin-right: 6px;"></i> Kiểm tra </button>
     </div>
    </div><!-- Bài tập 2 -->
    <div class="exercise-card">
     <div class="exercise-title">
      <div class="exercise-number">
       2
      </div><span>Các bước lưu chương trình trong Scratch</span>
     </div>
     <div class="draggable-area" id="exercise2"><!-- Items will be generated by JavaScript -->
     </div>
     <div class="feedback-message" id="feedback2"></div>
     <div class="progress-info" id="progress2"></div>
     <div class="buttons-container"><button class="btn btn-reset" onclick="resetExercise(2)"> <i data-lucide="rotate-ccw" style="width: 16px; height: 16px; display: inline; margin-right: 6px;"></i> Làm lại </button> <button class="btn btn-primary" onclick="checkExercise(2)"> <i data-lucide="check" style="width: 16px; height: 16px; display: inline; margin-right: 6px;"></i> Kiểm tra </button>
     </div>
    </div>
   </div>
  </div>
  <script>
    // Exercise data
    const exercises = {
      1: {
        items: [
          { id: 'ex1-a', text: 'Kéo thả lệnh từ nhóm lệnh Sự kiện vào khu vực chức năng chương trình.', label: 'A' },
          { id: 'ex1-b', text: 'Với mỗi việc, em thực hiện kéo lệnh từ nhóm lệnh Hiển thị vào khu vực chương trình và ghép nó vào ngay dưới lệnh trước đó; nhập nội dung lời nói (mô tả việc) và thời gian hiển thị lời nói.', label: 'B' },
          { id: 'ex1-c', text: 'Nháy chuột vào nút lệnh cờ xanh.', label: 'C' }
        ],
        correct: ['ex1-a', 'ex1-b', 'ex1-c']
      },
      2: {
        items: [
          { id: 'ex2-a', text: 'Mở thư mục sẽ chứa chương trình Scratch.', label: 'A' },
          { id: 'ex2-b', text: 'Gõ tên tệp vào ô File name.', label: 'B' },
          { id: 'ex2-c', text: 'Chọn thẻ Tập tin.', label: 'C' },
          { id: 'ex2-d', text: 'Chọn Lưu về máy tính.', label: 'D' },
          { id: 'ex2-e', text: 'Nháy chuột vào nút lệnh Save.', label: 'E' }
        ],
        correct: ['ex2-c', 'ex2-d', 'ex2-a', 'ex2-b', 'ex2-e']
      }
    };

    let currentState = {
      1: [],
      2: []
    };

    let draggedElement = null;
    let draggedFrom = null;

    // Initialize exercise
    function initExercise(exerciseNum) {
      const exercise = exercises[exerciseNum];
      const container = document.getElementById(`exercise${exerciseNum}`);
      
      // Shuffle items
      const shuffled = [...exercise.items].sort(() => Math.random() - 0.5);
      currentState[exerciseNum] = shuffled.map(item => item.id);
      
      container.innerHTML = '';
      shuffled.forEach((item, index) => {
        const itemEl = createDraggableItem(item, exerciseNum, index);
        container.appendChild(itemEl);
      });
      
      updateProgress(exerciseNum);
    }

    // Create draggable item
    function createDraggableItem(item, exerciseNum, position) {
      const div = document.createElement('div');
      div.className = 'draggable-item';
      div.draggable = true;
      div.dataset.id = item.id;
      div.dataset.exercise = exerciseNum;
      div.dataset.position = position;
      
      div.innerHTML = `
        <i data-lucide="grip-vertical" class="drag-handle" style="width: 18px; height: 18px;"></i>
        <div class="item-number">${item.label}</div>
        <div class="item-text">${item.text}</div>
      `;

      div.addEventListener('dragstart', handleDragStart);
      div.addEventListener('dragend', handleDragEnd);
      div.addEventListener('dragover', handleDragOver);
      div.addEventListener('drop', handleDrop);
      div.addEventListener('dragenter', handleDragEnter);
      div.addEventListener('dragleave', handleDragLeave);

      return div;
    }

    function handleDragStart(e) {
      draggedElement = this;
      draggedFrom = this.dataset.exercise;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      this.classList.remove('dragging');
      document.querySelectorAll('.draggable-item').forEach(item => {
        item.classList.remove('dragging');
      });
    }

    function handleDragOver(e) {
      if (e.preventDefault) {
        e.preventDefault();
      }
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDragEnter(e) {
      if (this !== draggedElement && this.classList.contains('draggable-item')) {
        this.style.borderTop = '3px solid #667eea';
      }
    }

    function handleDragLeave(e) {
      this.style.borderTop = '';
    }

    function handleDrop(e) {
      if (e.stopPropagation) {
        e.stopPropagation();
      }
      
      if (this === draggedElement) return false;

      const exerciseNum = parseInt(this.dataset.exercise);
      const draggedIndex = currentState[exerciseNum].indexOf(draggedElement.dataset.id);
      const targetIndex = currentState[exerciseNum].indexOf(this.dataset.id);

      if (draggedIndex !== -1 && targetIndex !== -1) {
        [currentState[exerciseNum][draggedIndex], currentState[exerciseNum][targetIndex]] = 
        [currentState[exerciseNum][targetIndex], currentState[exerciseNum][draggedIndex]];
        
        renderExercise(exerciseNum);
      }

      this.style.borderTop = '';
      return false;
    }

    function renderExercise(exerciseNum) {
      const container = document.getElementById(`exercise${exerciseNum}`);
      const exercise = exercises[exerciseNum];
      
      container.innerHTML = '';
      currentState[exerciseNum].forEach((itemId, index) => {
        const item = exercise.items.find(i => i.id === itemId);
        const itemEl = createDraggableItem(item, exerciseNum, index);
        container.appendChild(itemEl);
      });
      
      lucide.createIcons();
      updateProgress(exerciseNum);
    }

    function updateProgress(exerciseNum) {
      const exercise = exercises[exerciseNum];
      const correct = currentState[exerciseNum].filter((id, idx) => id === exercise.correct[idx]).length;
      const total = exercise.correct.length;
      const progressEl = document.getElementById(`progress${exerciseNum}`);
      progressEl.textContent = `Đã sắp xếp đúng: ${correct}/${total}`;
    }

    function checkExercise(exerciseNum) {
      const exercise = exercises[exerciseNum];
      const isCorrect = currentState[exerciseNum].every((id, idx) => id === exercise.correct[idx]);
      const feedbackEl = document.getElementById(`feedback${exerciseNum}`);
      const container = document.getElementById(`exercise${exerciseNum}`);
      
      feedbackEl.classList.remove('feedback-success', 'feedback-error', 'show');
      
      if (isCorrect) {
        feedbackEl.textContent = '✓ Chính xác! Bạn đã sắp xếp đúng thứ tự.';
        feedbackEl.classList.add('feedback-success', 'show');
        
        // Mark all items as correct
        container.querySelectorAll('.draggable-item').forEach(item => {
          item.classList.add('correct');
          item.querySelector('.item-number').classList.add('correct');
        });
      } else {
        feedbackEl.textContent = '✗ Chưa chính xác. Vui lòng kiểm tra lại thứ tự các bước.';
        feedbackEl.classList.add('feedback-error', 'show');
        
        container.querySelectorAll('.draggable-item').forEach(item => {
          item.classList.remove('correct');
          item.querySelector('.item-number').classList.remove('correct');
        });
      }
    }

    function resetExercise(exerciseNum) {
      const feedbackEl = document.getElementById(`feedback${exerciseNum}`);
      const container = document.getElementById(`exercise${exerciseNum}`);
      
      feedbackEl.classList.remove('feedback-success', 'feedback-error', 'show');
      container.querySelectorAll('.draggable-item').forEach(item => {
        item.classList.remove('correct');
        item.querySelector('.item-number').classList.remove('correct');
      });
      
      initExercise(exerciseNum);
      lucide.createIcons();
    }

    // Element SDK integration
    const defaultConfig = {
      app_title: 'Bài Tập Sắp Xếp Thứ Tự'
    };

    let config = { ...defaultConfig };

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (newConfig) => {
        config = newConfig;
        document.getElementById('appTitle').textContent = config.app_title || defaultConfig.app_title;
      },
      mapToCapabilities: () => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: () => new Map([
        ['app_title', config.app_title || defaultConfig.app_title]
      ])
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      initExercise(1);
      initExercise(2);
      lucide.createIcons();
    });
  </script>

</html>
